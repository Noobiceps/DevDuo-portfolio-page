<!-- HOW TO ADD / SWAP PICTURES
1) Save each picture as images/<name>.webp (or .jpg/.png), 1040 x 660 pixels, under 150 KB.
2) In index.html find the project's <article class="proj reveal"> and change the file name inside its <img src="images/....webp">.
3) To add another picture to the same card, copy one <img ...> line inside <div class="shots"> and change src + alt.
   The arrows and dots appear automatically when a card has 2 or more pictures.
-->
